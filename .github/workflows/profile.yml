name: Profile metrics

on:
  schedule:
    - cron: "17 */12 * * *"   # every 12 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # 📈 Stats
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics/stats.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, community, repositories
          config_timezone: Asia/Tokyo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 🦀 Languages
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          config_timezone: Asia/Tokyo
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_threshold: 2%
          plugin_languages_ignored: html, css, dockerfile, shell, makefile

  trophy:
    needs: metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Deno
        run: |
          curl -fsSL -o "$RUNNER_TEMP/deno.zip" https://github.com/denoland/deno/releases/download/v1.46.3/deno-x86_64-unknown-linux-gnu.zip
          unzip -q -o "$RUNNER_TEMP/deno.zip" -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Generate trophy
        env:
          GITHUB_TOKEN1: ${{ secrets.METRICS_TOKEN }}
        run: |
          git clone -q https://github.com/ryo-ma/github-profile-trophy "$RUNNER_TEMP/trophy"
          git -C "$RUNNER_TEMP/trophy" checkout -q 43736b50a82fca73c8df1c81abb40aa03519975c
          deno run --allow-net --allow-env --allow-read --allow-write \
            "$RUNNER_TEMP/trophy/render_svg.ts" n-takatsu "$GITHUB_WORKSPACE/metrics/trophy.svg" tokyonight

      - name: Commit trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/trophy.svg
          git diff --cached --quiet && exit 0
          git commit -q -m "Update metrics/trophy.svg [skip ci]"
          git pull -q --rebase origin main
          git push -q origin HEAD:main

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: n-takatsu
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - name: Push to output branch
        run: |
          mkdir -p "$RUNNER_TEMP/snake"
          cp dist/*.svg "$RUNNER_TEMP/snake/"
          cd "$RUNNER_TEMP/snake"
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update snake"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
